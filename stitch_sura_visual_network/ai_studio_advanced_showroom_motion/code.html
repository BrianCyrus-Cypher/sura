<style>
        body {

        }

        .tactile-btn {
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);

        }

        .stack-container:hover .stack-card:nth-child(2) { transform: translateY(0px) translateX(0px); }

<script>
        // Simple interactions for tactile buttons
        document.querySelectorAll('.tactile-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Remove active styling from all
                document.querySelectorAll('.tactile-btn').forEach(b => {
                    b.classList.remove('bg-surface-container-highest', 'text-primary-fixed');
                    b.classList.add('text-on-surface-variant');
                });
                
                // Add active styling to clicked
                const target = e.currentTarget;
                target.classList.remove('text-on-surface-variant');
                target.classList.add('bg-surface-container-highest', 'text-primary-fixed');
            });
        });
    </script>
