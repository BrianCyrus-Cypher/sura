<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sura - Create Account</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Sora:wght@700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#576c00",
                        "on-surface": "#e3e3dc",
                        "outline": "#8f937b",
                        "error": "#ffb4ab",
                        "tertiary-fixed-dim": "#bfc9bb",
                        "primary": "#ffffff",
                        "secondary-fixed-dim": "#cac6be",
                        "on-primary": "#293500",
                        "surface-variant": "#343531",
                        "inverse-surface": "#e3e3dc",
                        "secondary-container": "#494740",
                        "on-tertiary": "#2a3329",
                        "secondary": "#cac6be",
                        "surface-dim": "#121410",
                        "primary-fixed-dim": "#afd520",
                        "surface-container": "#1e201c",
                        "surface-tint": "#afd520",
                        "on-tertiary-fixed": "#151e15",
                        "surface-container-low": "#1a1c18",
                        "error-container": "#93000a",
                        "primary-fixed": "#caf240",
                        "surface": "#121410",
                        "surface-container-lowest": "#0d0f0b",
                        "on-primary-fixed-variant": "#3d4d00",
                        "on-surface-variant": "#c5c9af",
                        "on-error": "#690005",
                        "surface-container-high": "#292b26",
                        "background": "#121410",
                        "on-secondary-fixed": "#1d1c16",
                        "on-tertiary-container": "#5d675b",
                        "surface-container-highest": "#343531",
                        "on-secondary-container": "#b9b5ac",
                        "on-secondary": "#32302a",
                        "on-secondary-fixed-variant": "#494740",
                        "on-background": "#e3e3dc",
                        "outline-variant": "#454935",
                        "on-tertiary-fixed-variant": "#40493e",
                        "secondary-fixed": "#e7e2d9",
                        "tertiary-container": "#dbe6d6",
                        "primary-container": "#caf240",
                        "on-primary-fixed": "#171e00",
                        "inverse-primary": "#526600",
                        "tertiary-fixed": "#dbe6d6",
                        "on-error-container": "#ffdad6",
                        "surface-bright": "#383a35",
                        "tertiary": "#ffffff",
                        "inverse-on-surface": "#2f312c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "xs": "8px",
                        "giant": "64px",
                        "sm": "12px",
                        "base": "4px",
                        "md": "16px",
                        "xxl": "48px",
                        "margin-mobile": "16px",
                        "lg": "24px",
                        "xl": "32px",
                        "margin-desktop": "64px"
                    },
                    "fontFamily": {
                        "display-hero-mobile": ["Sora"],
                        "kicker": ["Hanken Grotesk"],
                        "label-md": ["Hanken Grotesk"],
                        "headline-lg": ["Sora"],
                        "display-hero": ["Sora"],
                        "body-lg": ["Hanken Grotesk"],
                        "headline-sm": ["Sora"],
                        "body-md": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "display-hero-mobile": ["44px", { "lineHeight": "44px", "letterSpacing": "-0.03em", "fontWeight": "800" }],
                        "kicker": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "display-hero": ["72px", { "lineHeight": "68px", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-sm": ["24px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        .input-editorial {
            border: none;
            border-bottom: 1px solid theme('colors.outline-variant');
            background-color: transparent;
            border-radius: 0;
            padding: theme('spacing.sm') 0;
            color: theme('colors.on-surface');
            transition: border-color 0.2s ease;
        }
        .input-editorial:focus {
            outline: none;
            box-shadow: none;
            border-bottom: 2px solid theme('colors.primary-fixed');
        }
        .input-editorial::placeholder {
            color: theme('colors.on-surface-variant');
            opacity: 0.7;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Transactional Header -->
<header class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-sm z-50 sticky top-0 bg-background/80 backdrop-blur-sm">
<div class="flex items-center gap-xs cursor-pointer group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary-fixed transition-colors">arrow_back</span>
<span class="font-kicker text-kicker uppercase tracking-widest text-on-surface-variant group-hover:text-primary-fixed transition-colors hidden md:block">Back</span>
</div>
<div class="font-display-hero-mobile text-display-hero-mobile md:font-headline-lg md:text-headline-lg tracking-tighter text-primary-fixed">
            SURA
        </div>
<div class="w-8"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content -->
<main class="flex-grow flex items-center justify-center px-margin-mobile md:px-margin-desktop py-giant md:py-xxl relative overflow-hidden">
<!-- Abstract Background Element -->
<div class="absolute top-0 right-0 w-[800px] h-[800px] bg-primary-fixed/5 rounded-full blur-[120px] pointer-events-none -translate-y-1/2 translate-x-1/3"></div>
<div class="w-full max-w-[500px] relative z-10">
<div class="mb-xl text-center">
<h1 class="font-display-hero-mobile text-display-hero-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-xs">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join the tactile editorial world of local signals.</p>
</div>
<form class="space-y-lg bg-surface-container p-lg md:p-xl rounded-xl border border-outline-variant/30 shadow-2xl shadow-black/50 relative overflow-hidden">
<!-- Subtle noise overlay for tactile feel -->
<div class="absolute inset-0 opacity-[0.03] pointer-events-none mix-blend-overlay" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>
<div class="relative z-10 space-y-md">
<!-- Display Name -->
<div class="relative group">
<label class="font-kicker text-kicker uppercase tracking-widest text-on-surface-variant block mb-base" for="displayName">Display Name</label>
<input class="input-editorial w-full font-body-lg text-body-lg" id="displayName" placeholder="Jane Doe" required="" type="text"/>
</div>
<!-- @handle -->
<div class="relative group">
<label class="font-kicker text-kicker uppercase tracking-widest text-on-surface-variant block mb-base" for="handle">@handle</label>
<div class="flex items-center">
<span class="text-on-surface-variant mr-xs font-body-lg text-body-lg mt-sm">@</span>
<input class="input-editorial w-full font-body-lg text-body-lg" id="handle" placeholder="janedoe" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div class="relative group">
<label class="font-kicker text-kicker uppercase tracking-widest text-on-surface-variant block mb-base" for="email">Email</label>
<input class="input-editorial w-full font-body-lg text-body-lg" id="email" placeholder="jane@example.com" required="" type="email"/>
</div>
<!-- Password -->
<div class="relative group">
<label class="font-kicker text-kicker uppercase tracking-widest text-on-surface-variant block mb-base" for="password">Password</label>
<input class="input-editorial w-full font-body-lg text-body-lg" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-0 bottom-sm text-on-surface-variant hover:text-primary-fixed transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<!-- Confirm Password -->
<div class="relative group">
<label class="font-kicker text-kicker uppercase tracking-widest text-on-surface-variant block mb-base" for="confirmPassword">Confirm Password</label>
<input class="input-editorial w-full font-body-lg text-body-lg" id="confirmPassword" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Terms Checkbox -->
<div class="relative z-10 flex items-start gap-sm mt-lg">
<div class="flex items-center h-5 mt-1">
<input class="w-4 h-4 rounded-sm border-outline-variant bg-surface text-primary-fixed focus:ring-primary-fixed focus:ring-offset-background" id="terms" type="checkbox"/>
</div>
<label class="font-body-md text-body-md text-on-surface-variant leading-tight" for="terms">
                        I agree to the <a class="text-primary-fixed hover:underline underline-offset-4 decoration-primary-fixed/50" href="#">Terms of Service</a> and <a class="text-primary-fixed hover:underline underline-offset-4 decoration-primary-fixed/50" href="#">Privacy Policy</a>.
                    </label>
</div>
<!-- Submit Button -->
<div class="relative z-10 pt-sm mt-xl">
<button class="w-full bg-[#D7FF4D] text-[#171e00] font-label-md text-label-md py-md px-lg rounded-full hover:bg-primary-fixed/90 transition-all active:scale-[0.98] flex items-center justify-center gap-xs" type="submit">
                        Join Sura
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
<!-- Sign In Link -->
<div class="relative z-10 text-center mt-md">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Already have an account? 
                        <a class="text-primary-fixed font-label-md text-label-md hover:underline underline-offset-4 ml-xs" href="#">Sign In</a>
</p>
</div>
</form>
</div>
</main>
<!-- Side Image Panel (Desktop only, for elevated aesthetic) -->
<aside class="hidden xl:block fixed top-0 right-0 w-1/3 h-screen border-l border-outline-variant/30 overflow-hidden z-0">
<div class="absolute inset-0 bg-surface-container/50 mix-blend-multiply z-10"></div>
<img class="w-full h-full object-cover filter grayscale-[30%] contrast-125" data-alt="A moody, high-contrast architectural photograph of a brutalist concrete structure illuminated by a single warm light source, embodying a tactile editorial aesthetic with deep moss and charcoal tones. The scene is grounded, local, and sophisticated." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAGkcUM-tbOBg10sz5UFKJwmlF6vp52bl2GANse286HgXS6CWwlBsR_88OSgbyzT1Eym1g_r1Th60kzrPEFlLEJ1cdOxQ-ap0T7r_7qY6Xj8pCdmg0NDS1lCR8F6_RK56TeCLWn3UtaAu65JaPc8fjPxWxPc_slRymAf6LRwsJ2zjMd5yr_R0p7u-qR7nM6LHJexEXdM3DejMC4mEoz0sAYY55W0QYE5F6qNmMlNVOsH4oonnzOxpxCrQ"/>
</aside>
</body></html>
