<style>
        .collage-container {
            perspective: 1000px;
        }
        .collage-item {
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .collage-item:hover {
            transform: scale(1.05) translateZ(20px);
            z-index: 20;
        }
        
        .gradient-text {
            background: linear-gradient(90deg, #caf240 0%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-between overflow-x-hidden pt-giant pb-xl md:px-margin-desktop px-margin-mobile">
<!-- Header / Brand Anchor -->
<header class="w-full flex justify-between items-center z-50">
<div class="font-display-hero-mobile md:font-display-hero text-display-hero-mobile md:text-display-hero tracking-tighter text-on-surface">
            SURA
        </div>
<div class="hidden md:flex gap-4">
<span class="font-kicker text-kicker uppercase text-on-surface-variant tracking-widest border border-outline-variant/30 px-4 py-2 rounded-full backdrop-blur-sm bg-surface/50">Landing Signal</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center w-full max-w-7xl mx-auto mt-xxl mb-giant relative z-10">
<h1 class="font-headline-lg-mobile md:font-display-hero text-headline-lg md:text-display-hero text-center max-w-3xl mb-giant z-20">
            See everyday moments from your <span class="gradient-text italic font-black">close friends</span>.
        </h1>
<!-- Collage Hero Object -->
<div class="relative w-full max-w-4xl h-[60vh] min-h-[400px] flex items-center justify-center collage-container z-10 my-xl">
<!-- Center Main Image -->
<div class="absolute w-64 md:w-80 h-96 md:h-[450px] bg-surface-container rounded-xl overflow-hidden shadow-2xl z-10 collage-item transform-gpu">
<img class="w-full h-full object-cover opacity-90 hover:opacity-100 transition-opacity" data-alt="A tactile, high-contrast editorial photo showing a close group of friends in a candid, raw moment. Warm, earthy tones with strong directional lighting mimicking late afternoon sun. Concrete and textured fabric background elements." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBeeADMokfczOB5SzzydJElKSjple-6AhSzMZNBLhgGg2nwic8J6FRN6xNzNsgdBfKa96vk1UmjL15QFRl3YnLRhaNLltlWUBS5KjTkgAypWWBUGhNbOV0Xo4nIdjh5s3qtdjrZyuxFSGOI0a9sZ3V9TYV5uF0L1RNlvRjn7teddsM9Kg9ztHvcjOTvSa5rZ85jF4W5qzXW_cDosBxvsQtosEA65KTPpxCdLHZMEKiEh1zeGvk3B3h1bA"/>
<div class="absolute bottom-4 left-4 right-4 flex justify-between items-center">
<div class="h-1 bg-surface/50 rounded-full w-full overflow-hidden mr-4 border border-outline-variant/30">
<div class="w-1/3 h-full bg-primary-fixed rounded-full"></div>
</div>
<span class="material-symbols-outlined text-primary-fixed cursor-pointer" data-weight="fill">favorite</span>
</div>
</div>
<!-- Left Angled Image -->
<div class="absolute w-56 md:w-64 h-80 md:h-96 bg-surface-container-high rounded-lg overflow-hidden shadow-xl -ml-[150px] md:-ml-[300px] mt-12 -rotate-6 z-0 collage-item grayscale-[0.3] opacity-80 border border-outline-variant/20">
<img class="w-full h-full object-cover" data-alt="A moody, cinematic portrait of a young creative in an urban setting. Shot with high-contrast, deep shadows and muted mossy greens and charcoal tones, resembling a tactile architectural journal." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCLzkDHr65VFDY7QcXlKQR1y0XDZOfUxE99sxinncxcb_crvh1v8MzLnIl4AonDcehC4lvYMmT95ihgAoSZXkTDSh9d9mThOSk7phcZGn5Lc-YBxV3xvP2d086t7CkxgE6VE0ZPTKkbaBhoxLhSyRuCPyXVTGdl7tHobVdhSstCFVajiwC_7f8_kCStYaERTZglWFTwN1Ap6uCMXtI76g5r170zG8qzs9-MaEQWnXR4WKX1NpIVxz0L8A"/>
<div class="absolute -left-6 bottom-12 bg-primary text-on-primary w-12 h-12 rounded-full flex items-center justify-center shadow-lg rotate-12">
<span class="material-symbols-outlined" data-weight="fill">favorite</span>
</div>
</div>
<!-- Right Angled Image -->
<div class="absolute w-56 md:w-64 h-80 md:h-96 bg-surface-container-high rounded-lg overflow-hidden shadow-xl ml-[150px] md:ml-[300px] -mt-12 rotate-6 z-0 collage-item grayscale-[0.3] opacity-80 border border-outline-variant/20">
<img class="w-full h-full object-cover" data-alt="Dynamic, motion-blurred shot of friends skateboarding down a sunlit street. Warm, golden-hour lighting mixed with the gritty texture of asphalt. Shot in a minimalist, documentary style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA_3HKTPbLJAOn7mqhO3Qfl8A5AjyZBXp9wvvy0M0OsR8R2DZuYGm60YXQv_BQ7kMqx1Zn2KCp4xteAMs0rw7LVTc0u8h1KzxF820URPIsS3PvHM3FR3EA8Rb2szGUSOWLA_ciSnTuN500LqXIUw0__MK8Gsq55hDgi7MKOU_OQtb5gYGf1FmVw-gXvRHb6gkYuD4PvYDGqwjUvFLArZigaSUU660v6AKN26E3tcjMDxoUsQ1kVo2WJFg"/>

<span class="material-symbols-outlined" data-weight="fill">star</span>
</div>
</div>
</div>
</main>

<footer class="w-full flex justify-center z-20 mt-xl">
<button class="bg-[#D7FF4D] text-[#121410] font-body-md text-body-md font-bold py-4 px-8 rounded-full hover:bg-primary-fixed-dim transition-colors shadow-xl flex items-center gap-2 group">
            Explore the Signal
            <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</footer>
<!-- Background Atmospheric Elements -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden mix-blend-overlay opacity-30">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-surface-tint rounded-full blur-[150px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-on-tertiary-container rounded-full blur-[120px]"></div>
</div>
