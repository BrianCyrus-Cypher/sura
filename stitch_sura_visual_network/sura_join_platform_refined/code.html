<style>
        .glass-card {
            background: rgba(18, 20, 16, 0.6);
            backdrop-filter: blur(12px);

<body class="bg-background text-on-surface antialiased min-h-screen relative overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Background Image -->
<div class="fixed inset-0 z-0">
<img alt="" class="w-full h-full object-cover opacity-80 mix-blend-luminosity grayscale" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC5-9pZwne1DelP5ECPjsr9MWDvM4hshDuYjIg7EvLsJFrm_m3wq5U2RHyEqAYbYu4KyYFFzGEsRM2sOrcKWLjfR8vt4CK1yX2ZPkUgcPJSHuYIjoZrPY2CJv289SFkj8zfwCVB4IZShe5yvozpyH3u8QxpB1Au2b6c0ziFa_wgYYR22VPULT4ZTFSjCwrJQH2bUVr63b5VkG7q-KET7IfjeZtp4QV6hMf9wAmX83mIVJQocs5KC4CtMg"/>
<div class="absolute inset-0 bg-gradient-to-b from-background/20 via-background/40 to-background/90"></div>
</div>
<!-- Main Content Container -->
<div class="relative z-10 flex flex-col min-h-screen px-margin-mobile pt-xxl pb-margin-mobile">
<!-- Header -->
<header class="w-full flex justify-center mb-xl">
<h1 class="font-display-hero-mobile text-display-hero-mobile tracking-tighter text-primary">SURA</h1>
</header>
<!-- Form Card -->
<main class="flex-grow flex flex-col justify-center max-w-md mx-auto w-full">
<div class="glass-card rounded-xl p-lg shadow-2xl relative overflow-hidden">
<!-- Decorative Top Border -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-outline-variant/30 to-transparent"></div>
<div class="mb-lg">
<h2 class="font-headline-sm text-headline-sm text-primary mb-base">Create Account</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Join the local signal.</p>
</div>
<form class="space-y-md">
<!-- Display Name -->
<div>
<label class="sr-only" for="displayName">Display Name</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant/50 text-primary font-body-md text-body-md py-sm px-0 focus:ring-0 input-underline transition-colors placeholder:text-on-surface-variant/50" id="displayName" name="displayName" placeholder="Display Name" type="text"/>
</div>
<!-- Handle -->
<div class="relative">
<label class="sr-only" for="handle">Handle</label>
<div class="absolute inset-y-0 left-0 flex items-center pointer-events-none">
<span class="text-on-surface-variant font-body-md text-body-md">@</span>
</div>
<input class="w-full bg-transparent border-0 border-b border-outline-variant/50 text-primary font-body-md text-body-md py-sm pl-6 pr-0 focus:ring-0 input-underline transition-colors placeholder:text-on-surface-variant/50" id="handle" name="handle" placeholder="username" type="text"/>
</div>
<!-- Email -->
<div>
<label class="sr-only" for="email">Email</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant/50 text-primary font-body-md text-body-md py-sm px-0 focus:ring-0 input-underline transition-colors placeholder:text-on-surface-variant/50" id="email" name="email" placeholder="Email Address" type="email"/>
</div>
<!-- Password -->
<div>
<label class="sr-only" for="password">Password</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant/50 text-primary font-body-md text-body-md py-sm px-0 focus:ring-0 input-underline transition-colors placeholder:text-on-surface-variant/50" id="password" name="password" placeholder="Password" type="password"/>
</div>
<!-- Confirm Password -->
<div>
<label class="sr-only" for="confirmPassword">Confirm Password</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant/50 text-primary font-body-md text-body-md py-sm px-0 focus:ring-0 input-underline transition-colors placeholder:text-on-surface-variant/50" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" type="password"/>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start pt-sm">
<div class="flex items-center h-5">
<input class="focus:ring-primary-container h-4 w-4 text-primary-container border-outline-variant bg-surface rounded-DEFAULT focus:ring-offset-surface" id="terms" name="terms" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="font-body-md text-[14px] text-on-surface-variant leading-tight" for="terms">
                                I agree to the <a class="text-primary hover:underline underline-offset-4 decoration-primary-container/50" href="#">Terms of Service</a> and <a class="text-primary hover:underline underline-offset-4 decoration-primary-container/50" href="#">Privacy Policy</a>.
                            </label>
</div>
</div>
<!-- Submit Button -->
<div class="pt-lg">
<button class="w-full flex justify-center py-sm px-4 border border-transparent rounded-full shadow-sm font-label-md text-label-md text-on-primary-container bg-primary-container hover:bg-primary-fixed-dim transition-colors active:scale-[0.98]" type="submit">
                            Join Sura
                        </button>
</div>
</form>
<!-- Footer Link -->
<div class="mt-lg text-center">
<p class="font-body-md text-[14px] text-on-surface-variant">
                        Already have an account? <a class="font-label-md text-primary hover:text-primary-container transition-colors" href="#">Sign In</a>
</p>
</div>
</div>
</main>
</div>
</body></html>
