<style>
        /* Custom scrollbar for webkit to keep editorial feel */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #343531;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #454935;
        }
        
        /* Subtle selection styling */
        ::selection {
            background-color: #caf240;
            color: #171e00;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen flex flex-col font-sans antialiased">
<!-- Top Navigation (Transactional Layout - Shell Suppressed) -->
<header class="flex justify-between items-center w-full px-margin-mobile h-16 sticky top-0 bg-background/90 backdrop-blur-md z-40">
<button class="text-on-surface-variant hover:text-on-background transition-colors p-2 -ml-2 rounded-full focus:outline-none focus:ring-2 focus:ring-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<div class="font-kicker text-kicker uppercase text-on-surface-variant">Intent</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content Area -->
<main class="flex-1 px-margin-mobile pb-giant">
<!-- Hero Header -->
<div class="mt-md mb-xl pt-sm">
<h1 class="font-display-hero-mobile text-display-hero-mobile text-on-background mb-base">Make a Signal</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-sm">How would you like to begin mapping your local environment?</p>
</div>
<!-- Intent Selection Grid (Vertical Stack for Mobile, Bento feel) -->
<div class="flex flex-col gap-sm">
<!-- Option 1: Shape a direction -->
<button class="w-full text-left group relative flex flex-col p-lg rounded-xl bg-surface-container border border-outline-variant hover:border-primary-container transition-all duration-300 overflow-hidden outline-none focus:ring-2 focus:ring-primary-container">
<!-- Hover/Active Background Shift -->
<div class="absolute inset-0 bg-primary-container opacity-0 group-hover:opacity-5 transition-opacity duration-300"></div>
<div class="flex justify-between items-start mb-lg relative z-10 w-full">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface group-hover:text-primary-container group-hover:bg-[#171e00] transition-colors border border-transparent group-hover:border-primary-container/30">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">explore</span>
</div>
<div class="w-8 h-8 rounded-full flex items-center justify-center bg-transparent group-hover:bg-primary-container transition-colors transform translate-x-2 opacity-0 group-hover:translate-x-0 group-hover:opacity-100">
<span class="material-symbols-outlined text-[18px] text-on-primary-container">arrow_forward</span>
</div>
</div>
<h2 class="font-headline-sm text-headline-sm text-on-background mb-xs relative z-10 group-hover:text-primary-container transition-colors">Shape a direction</h2>
<p class="font-body-md text-body-md text-on-surface-variant relative z-10 pr-lg">Curate a moodboard, set a creative trajectory, or establish a guiding aesthetic.</p>
</button>
<!-- Option 2: Ask for a product or service -->
<button class="w-full text-left group relative flex flex-col p-lg rounded-xl bg-surface-container border border-outline-variant hover:border-primary-container transition-all duration-300 overflow-hidden outline-none focus:ring-2 focus:ring-primary-container">
<div class="absolute inset-0 bg-primary-container opacity-0 group-hover:opacity-5 transition-opacity duration-300"></div>
<div class="flex justify-between items-start mb-lg relative z-10 w-full">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface group-hover:text-primary-container group-hover:bg-[#171e00] transition-colors border border-transparent group-hover:border-primary-container/30">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">local_mall</span>
</div>
<div class="w-8 h-8 rounded-full flex items-center justify-center bg-transparent group-hover:bg-primary-container transition-colors transform translate-x-2 opacity-0 group-hover:translate-x-0 group-hover:opacity-100">
<span class="material-symbols-outlined text-[18px] text-on-primary-container">arrow_forward</span>
</div>
</div>
<h2 class="font-headline-sm text-headline-sm text-on-background mb-xs relative z-10 group-hover:text-primary-container transition-colors">Ask for a product</h2>
<p class="font-body-md text-body-md text-on-surface-variant relative z-10 pr-lg">Submit a request or inquiry to our network of local creators and businesses.</p>
</button>
<!-- Option 3: Save a field note -->
<button class="w-full text-left group relative flex flex-col p-lg rounded-xl bg-surface-container border border-outline-variant hover:border-primary-container transition-all duration-300 overflow-hidden outline-none focus:ring-2 focus:ring-primary-container">
<div class="absolute inset-0 bg-primary-container opacity-0 group-hover:opacity-5 transition-opacity duration-300"></div>
<div class="flex justify-between items-start mb-lg relative z-10 w-full">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface group-hover:text-primary-container group-hover:bg-[#171e00] transition-colors border border-transparent group-hover:border-primary-container/30">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">edit_note</span>
</div>
<div class="w-8 h-8 rounded-full flex items-center justify-center bg-transparent group-hover:bg-primary-container transition-colors transform translate-x-2 opacity-0 group-hover:translate-x-0 group-hover:opacity-100">
<span class="material-symbols-outlined text-[18px] text-on-primary-container">arrow_forward</span>
</div>
</div>
<h2 class="font-headline-sm text-headline-sm text-on-background mb-xs relative z-10 group-hover:text-primary-container transition-colors">Save a field note</h2>
<p class="font-body-md text-body-md text-on-surface-variant relative z-10 pr-lg">Quickly capture an observation, tactile detail, or fleeting thought in the moment.</p>
</button>
<!-- Option 4: Start an AI Studio edit -->
<button class="w-full text-left group relative flex flex-col p-lg rounded-xl bg-surface-container border border-outline-variant hover:border-primary-container transition-all duration-300 overflow-hidden outline-none focus:ring-2 focus:ring-primary-container">
<!-- Special subtle ambient gradient for AI option -->
<div class="absolute inset-0 bg-gradient-to-br from-primary-container/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
<div class="flex justify-between items-start mb-lg relative z-10 w-full">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface group-hover:text-primary-container group-hover:bg-[#171e00] transition-colors border border-transparent group-hover:border-primary-container/30 shadow-[0_0_15px_rgba(202,242,64,0.0)] group-hover:shadow-[0_0_15px_rgba(202,242,64,0.15)]">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<div class="w-8 h-8 rounded-full flex items-center justify-center bg-transparent group-hover:bg-primary-container transition-colors transform translate-x-2 opacity-0 group-hover:translate-x-0 group-hover:opacity-100">
<span class="material-symbols-outlined text-[18px] text-on-primary-container">arrow_forward</span>
</div>
</div>
<h2 class="font-headline-sm text-headline-sm text-on-background mb-xs relative z-10 group-hover:text-primary-container transition-colors flex items-center gap-2">
                    Start an AI Studio edit
                </h2>
<p class="font-body-md text-body-md text-on-surface-variant relative z-10 pr-lg">Enhance imagery or synthesize concepts using our generative tools.</p>
</button>
</div>
</main>
