<style>
        .hotspot-pulse {
            box-shadow: 0 0 0 0 rgba(202, 242, 64, 0.7);
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(202, 242, 64, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(202, 242, 64, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(202, 242, 64, 0); }
        }
        
        /* Custom range slider styling for the synthesis rail */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #caf240;
            cursor: pointer;
            margin-top: -5px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            cursor: pointer;
            background: #454935;
            border-radius: 1px;
        }
        
        .fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

<script>
        function toggleDetailCard(cardId) {
            const card = document.getElementById(cardId);
            if (!card) return;
            
            // Hide other cards if they exist (simple logic for now)
            const allCards = document.querySelectorAll('aside');
            allCards.forEach(c => {
                if (c.id !== cardId && !c.classList.contains('hidden')) {
                    c.classList.add('hidden');
                    c.classList.remove('fade-in-up');
                }
            });

            if (card.classList.contains('hidden')) {
                card.classList.remove('hidden');
                // Trigger reflow to restart animation
                void card.offsetWidth;
                card.classList.add('fade-in-up');
            } else {
                card.classList.add('hidden');
                card.classList.remove('fade-in-up');
            }
        }
    </script>
